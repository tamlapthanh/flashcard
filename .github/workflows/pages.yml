name: Deploy to GitHub Pages

# Manual only. The site is normally published from the gh-pages branch (`npx gh-pages -d dist`, see HUONG-DAN.md), and
# the github-pages environment only accepts that branch, so running on every push to main always failed.
# To publish with Actions instead: Settings > Pages > Source: GitHub Actions, allow main in Settings > Environments >
# github-pages, set the Variable VITE_API_URL, then run this workflow by hand (Actions > Run workflow).
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          VITE_BASE: /${{ github.event.repository.name }}/
          VITE_API_URL: ${{ vars.VITE_API_URL }}
          VITE_API_KEY: ${{ vars.VITE_API_KEY }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
