name: Keep Render server awake

# The free Render instance sleeps after ~15 minutes without a request. GitHub pings its /health about every 10 minutes,
# only between 06:00 and 23:00 Vietnam time (the server may sleep at night). The timing is approximate (GitHub starts
# scheduled runs a little late), which is fine: the goal is only to keep the server from going to sleep.
# Needs the repo variable PING_URL = https://<service>.onrender.com/health   (Settings > Secrets and variables > Actions > Variables)
on:
  schedule:
    # Cron uses UTC; Vietnam is UTC+7. Hours 23 and 0-15 UTC = 06:00 to 22:59 in Vietnam, so no pings from 23:00 to 06:00.
    # Minutes 3, 13, 23... instead of 0, 10, 20...: GitHub is busiest on the round minutes and skips more runs there.
    - cron: '3-53/10 23,0-15 * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: keep-awake
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 4 # longer than curl's worst case below (2 x 70 s + 10 s), so a slow wake-up is never cut off
    steps:
      - name: Ping /health
        env:
          PING_URL: ${{ vars.PING_URL }}
        run: |
          if [ -z "$PING_URL" ]; then
            echo "Set the repository variable PING_URL (https://<service>.onrender.com/health)" >&2
            exit 1
          fi
          # a sleeping server needs 30-60 s to answer the first request, so wait long and retry once
          curl --fail --silent --show-error --max-time 70 --retry 1 --retry-delay 10 --retry-all-errors "$PING_URL"
          echo
