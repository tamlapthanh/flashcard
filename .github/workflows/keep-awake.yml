name: Keep Render server awake

# The free Render instance sleeps after ~15 minutes without a request. GitHub pings its /health every 10 minutes,
# only between 06:00 and 23:00 Vietnam time (the server may sleep at night).
# Needs the repo variable PING_URL = https://<service>.onrender.com/health   (Settings > Secrets and variables > Actions > Variables)
on:
  schedule:
    # Cron uses UTC; Vietnam is UTC+7. Hours 23 and 0-15 UTC = 06:00 to 22:59 in Vietnam, so no pings from 23:00 to 06:00.
    # GitHub may start a run a few minutes late and never runs more often than every 5 minutes.
    - cron: '*/10 23,0-15 * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: keep-awake
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping /health
        env:
          PING_URL: ${{ vars.PING_URL }}
        run: |
          if [ -z "$PING_URL" ]; then
            echo "Set the repository variable PING_URL (https://<service>.onrender.com/health)" >&2
            exit 1
          fi
          # a sleeping server needs 30-60 s to answer the first request, so wait long and retry
          curl --fail --silent --show-error --max-time 90 --retry 2 --retry-delay 10 --retry-all-errors "$PING_URL"
          echo
